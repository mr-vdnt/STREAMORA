apiVersion: v1
kind: Service
metadata:
  name: streamora-api-service
spec:
  type: ClusterIP
  selector:
    app: streamora-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamora-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - streamora.ai
    secretName: streamora-tls
  rules:
  - host: streamora.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamora-api-service
            port:
              number: 80
